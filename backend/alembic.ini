[alembic]
# Carpeta donde vive el código de migraciones (env.py, script.py.mako, versions/)
script_location = alembic
# Agrega el directorio actual (backend/) al sys.path para poder importar "app"
prepend_sys_path = .
version_path_separator = os

# La URL se inyecta desde app/core/config.py (settings.ASYNC_DATABASE_URL)
# dentro de alembic/env.py. No pongas credenciales aquí.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S