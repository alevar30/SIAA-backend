name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: siaa_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: siaa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siaa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://siaa_test:ci_test_only@localhost:5432/siaa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check app tests alembic
      - run: ruff format --check app tests
      - run: python -m pytest -q
